services:
  remna-bot:
    # image: ghcr.io/dignezzz/remna-admin-bot:latest
    build: .
    container_name: remna-telegram-bot-prod
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

    volumes:
      - remna-bot-logs:/app/logs
      # - ./.env:/app/.env:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

    networks:
      - remnawave-network

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    user: "1000:1000"

volumes:
  remna-bot-logs:
    driver: local

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true
